<!DOCTYPE html>
<html lang="id">
<head>
<meta charset='UTF-8'/>
<meta content='width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no' name='viewport'/>
<title>POS KASIR</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%9B%92%3C/text%3E%3C/svg%3E">
<script src="https://unpkg.com/lucide@latest"></script>
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
<div class='pk-root' id='pkRoot'>

  <!-- LOGIN SCREEN -->
  <div id='pkLoginScreen'>
    <div class='pk-login-wrap'>
      <div class="pk-login-logo">
        <div class="pk-logo-icon">🛒</div>
      </div>
      <h2>POS Kasir Pro</h2>
      <p class="subtitle">Sistem Kasir Modern & Mudah Dikelola</p>
      <div class='pk-field'>
        <label>Username</label>
        <input id='pkLoginUser' placeholder='admin' type='text'/>
      </div>
      <div class='pk-field'>
        <label>Password</label>
        <input id='pkLoginPass' placeholder='admin123' type='password'/>
      </div>
      <div class='pk-error' id='pkLoginError'></div>
      <button class='pk-btn pk-btn-large' onclick='pkLogin()'>Masuk ke Sistem</button>
      <p class="login-hint">Akun demo: admin/admin123, kasir/kasir123</p>
    </div>
  </div>

  <!-- APP SHELL -->
  <div class='pk-hidden' id='pkAppShell'>
    <div class='pk-shell'>
      
      <!-- SIDEBAR -->
      <aside class="pk-sidebar" id="pkSidebar">
        <!-- Rendered by JS -->
      </aside>
      
      <div class="pk-sidebar-overlay" onclick="pkToggleSidebar()"></div>

      <div class='pk-main-wrap'>
        <div class='pk-topbar'>
          <div class="pk-topbar-left">
            <button class="pk-sidebar-toggle" onclick="pkToggleSidebar()">
              <i data-lucide="menu"></i>
            </button>
            <div id='pkStoreName'></div>
          </div>
          <div class="pk-topbar-right">
            <span id='pkUserLabel'></span>
          </div>
        </div>
        <div class='pk-content-wrap' id='pkMain'>
          <!-- Content rendered by JS -->
        </div>
      </div>
    </div>
  </div>

</div>
<div class='pk-hidden' id='pk-receipt'></div>
<script src="assets/js/app.js"></script>
</body>
</html>
